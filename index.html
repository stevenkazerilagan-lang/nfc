<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Steven Kazer Ilagan | Digital Calling Card</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
    <style>
        :root{--black:#000;--navy:#0a1730;--navy-2:#13264a;--gray:#2b2f36;--gray-2:#9aa3b2;--white:#f4f6fa;
            box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        *,*::before,*::after{box-sizing:inherit}
        html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
        body{margin:0;min-height:100%;background:var(--black);color:var(--white);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;display:flex;justify-content:center;align-items:center;padding:24px 16px}
        .card{width:100%;max-width:420px;background:var(--navy);border:1px solid var(--gray);border-radius:20px;overflow:hidden}
        .photo{background:var(--gray);width:150px;height:150px;border-radius:50%;overflow:hidden;margin:32px auto 0;border:3px solid var(--gray)}
        .photo img{width:100%;height:100%;object-fit:cover;display:block}
        .info{padding:20px 24px 8px;text-align:center}
        h1{margin:0;font-size:1.8rem;line-height:1.15;font-weight:800;letter-spacing:-.01em}
        .sub{margin:6px 0 0;color:var(--gray-2);font-size:1rem}
        .links{display:flex;flex-direction:column;gap:12px;padding:20px 24px 28px}
        .btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--black);border:1px solid var(--gray);color:var(--white);text-decoration:none;font-weight:600;font-size:1.05rem}
        .btn:hover{background:var(--navy-2)}
        .btn:focus-visible{outline:3px solid var(--white);outline-offset:2px}
        .btn svg{width:24px;height:24px;flex:none;fill:currentColor}
        .btn small{display:block;color:var(--gray-2);font-weight:400;font-size:.9rem;word-break:break-all}
        .primary{background:var(--navy-2);border-color:var(--gray-2)}
        .primary:hover{background:var(--gray)}
    </style>
</head>
